<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pesquisar Pokémons | Pokedex</title>
  <link rel="stylesheet" href="../css/pokemonPesquisa.css" />
  <script src="../Js/efeitos.js" defer></script>
  <script src="../Js/Backend.js" defer></script>
</head>

<body>
  <h1>Pesquisar Pokémons</h1>
  <img class="Pikachu" src="../Images/Pikachu.png" alt="Pikachu">
  

  <p class="apresentacao">
    Aqui você poderá pesquisar pokémons específicos sem precisar adicioná-los
    à sua pokedex.
  </p>
  <input type="text" id="nome" placeholder="Digite o nome do Pokémon" />
  <button type="button" class="pesquisar" onclick="ConsumirApi()" id="botao-pesquisar">
    Pesquisar
  </button>
  <div id="loading"></div>
  <h3>Informações do Pokémon</h3>
  <div id="pokemon-result">
    <div class="dados-pokemon">
      <!--id-->
      <div class="campo">
        <label for="pokemon-id">id:</label>
        <input type="text" id="pokemon-id" readonly />
      </div>
      <div class="campo">
        <label for="pokemon-name">Nome:</label>
        <input type="text" id="pokemon-name" readonly />
      </div>
      <!--Altura-->
      <div class="campo">
        <label for="pokemon-height">Altura:</label>
        <input type="text" id="pokemon-height" readonly />
      </div>
      <!--Peso-->
      <div class="campo">
        <label for="pokemon-weight">Peso:</label>
        <input type="text" id="pokemon-weight" readonly />
      </div>
    </div>
    <div class="dados-pokemon">
      <div class="campo">
        <label for="pokemon-id">Habilidade 1:</label>
        <input type="text" id="pokemon-abilities1" readonly />
      </div>
      <div class="campo">
        <label for="pokemon-id">Habilidade 2:</label>
        <input type="text" id="pokemon-abilities2" readonly />
      </div>
      <div class="campo">
        <label for="pokemon-id">Vida:</label>
        <input type="text" id="pokemon-Life" readonly />
      </div>
      <div class="campo">
        <label for="pokemon-id">Ataque:</label>
        <input type="text" id="pokemon-Attack" readonly />
      </div>
    </div>
    <h3>Imagens do Pokémon</h3>
    <div class="imagens-container">
      <div id="imagem-pokemon-default" class="imagem-pokemon">
        <p class="imagem-label">Pokemon Padrão Masculino</p>
      </div>
      <div id="imagem-pokemon" class="imagem-pokemon">
        <p class="imagem-label">Pokemon Padrão Feminino</p>
      </div>
    </div>
  </div>
</body>

</html>
